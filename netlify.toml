# Build the Expo web app + copy your landing/app into it
[build]
  command = "cd frontend && npm install && npx expo export --platform web && mkdir -p dist/app && cp -r ../landing/app/* dist/app/ 2>/dev/null || true"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"

# --- YOUR APP stays on YOUR domain ---
[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app/:splat"
  status = 200

# --- BATCH BIBLE short links (external) ---
[[redirects]]
  from = "/batch"
  to = "https://barbatchbible.netlify.app"
  status = 302
  force = true

[[redirects]]
  from = "/batch/*"
  to = "https://barbatchbible.netlify.app/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/bible"
  to = "https://barbatchbible.netlify.app"
  status = 302
  force = true

# --- FIX FOR /menu/ 404 - must be BEFORE /* ---
[[redirects]]
  from = "/menu"
  to = "/menu/index.html"
  status = 200

[[redirects]]
  from = "/menu/"
  to = "/menu/index.html"
  status = 200

[[redirects]]
  from = "/menu/*"
  to = "/menu/:splat"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/gallery/index.html"
  status = 200

[[redirects]]
  from = "/gallery/"
  to = "/gallery/index.html"
  status = 200

[[redirects]]
  from = "/gallery/*"
  to = "/gallery/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Expo SPA fallback - MUST be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
