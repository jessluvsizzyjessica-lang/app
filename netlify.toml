# Build the Expo web app. `base` points Netlify at the frontend package so the
# dependency install step runs there; without it the repo root has no
# package.json, nothing gets installed, and `npx expo` falls back to fetching a
# bare CLI that cannot read the project's Expo config.
[build]
  command = "cd frontend && npx expo export --platform web"
  publish = "frontend/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
