# Build the Expo web app.
[build]
  command = "cd frontend && npm install && npx expo export --platform web"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# IMPORTANT: Let /menu/ serve its own files
[[redirects]]
  from = "/menu/*"
  to = "/menu/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
