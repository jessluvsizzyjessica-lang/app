[build]
  command = "cd frontend && npm install && npx expo export --platform web"
  publish = "frontend/dist"

# Short link: themobilemixeryca.com/batch → Bar Batch Bible
[[redirects]]
  from = "/batch"
  to = "https://barbatchbible.netlify.app"
  status = 302
  force = true

[[redirects]]
  from = "/batch/*"
  to = "https://barbatchbible.netlify.app/:splat"
  status = 302
  force = true

# Short link: themobilemixeryca.com/bible → Bar Batch Bible
[[redirects]]
  from = "/bible"
  to = "https://barbatchbible.netlify.app"
  status = 302
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/menu/*"
  to = "/menu/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
